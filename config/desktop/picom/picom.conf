#backend = "glx";
#vsync = false;
#

################################
# Core
################################
backend = "glx";               # GLX가 Xrender보다 일반적으로 빠름
vsync = true;                  # tearing 억제. 문제 있으면 false
use-damage = true;             # 부분 리렌더(대부분의 성능 핵심)
log-level = "warn";

################################
# Unredirect (성능/지연)
################################
unredir-if-possible = true;    # 정지/전화면 등에서 컴포지터 우회
unredir-if-possible-delay = 200;
unredir-if-possible-exclude = [
  "focused && class_g ?= 'mpv'",
  "focused && class_g ?= 'vlc'",
  "fullscreen"                 # 전화면은 대개 우회가 이득
];

################################
# 효과 비활성화 (오버헤드 절감)
################################
shadow = false;
fading = false;
blur-method = "none";
corner-radius = 0;

################################
# 감지/포커스(지연 없는 포커싱 유지)
################################
detect-rounded-corners = true;
detect-client-leader   = true;
detect-transient       = true;
mark-wmwin-focused     = true;
mark-ovredir-focused   = true;
use-ewmh-active-win    = true;

################################
# 윈도 타입 미세조정(필요 최소)
################################
wintypes = {
  tooltip = { fade = false; shadow = false; focus = true; full-shadow = false; };
  dock    = { shadow = false; };
  dnd     = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};



active-opacity = 1.0;
#inactive-opacity = 0.9;
inactive-dim = 0.10;

detect-client-opacity = true;

opacity-rule = [
  "0:_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'"
];
# steady-state opacity per window is set by i3-focus-urgent (via _NET_WM_WINDOW_OPACITY,
# so flashfocus keeps working); picom honours it through detect-client-opacity.

# smooth geometry changes (e.g. dunst shrinking when a big notification closes)
animations = ({
  triggers = ["open", "show"];
  preset = "appear";
  duration = 0.15;
}, {
  triggers = ["close", "hide"];
  preset = "disappear";
  duration = 0.12;
}, {
  triggers = ["geometry"];
  preset = "geometry-change";
  duration = 0.18;
});

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
