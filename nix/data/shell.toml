# fish aliases and abbreviations, read by nix/home/fish.nix (data only).

# Aliases become fish functions, so fish's own code and scripts that call the command get them too
# (e.g. fish's completion setup printed "mkdir: created directory"). Prefer abbrs: they expand only when typed.
[aliases]

[abbrs]
mv = "mv -iv"
cp = "cp -riv"
rm = "rm -Iv"
mkdir = "mkdir -vp"
dotsetup = "$HOME/.dotfiles/setup.sh"
sfish = "source $HOME/.config/fish/config.fish"
ga = "git add"
gb = "git branch"
gcm = "git commit -m"
gps = "git push"
gpl = "git pull"
gco = "git checkout"
gs = "git switch"
gd = "git diff"
gl = "git log --branches --graph --decorate --oneline"
gst = "git status"
gcl = "git clone"
cld = "ccs"
clds = "ccs auth default (ccs-lru-account)"
cldr = "ccs --resume"
cldd = "ccs --dangerously-skip-permissions"
cldrd = "ccs --resume --dangerously-skip-permissions"
clda = "ccs auth list"
dk = "docker"
cdx = "codex"
cdxr = "codex resume"
tm = "tmux"
tma = "tmux attach"
tml = "tmux ls"
add = "adb devices"
adp = "adb pair"
adc = "adb connect"
adsh = "adb shell"
py = "python3"
pip = "python3 -m pip"
l = "eza -l -s type"
tree = "eza --tree"
rp = "realpath"

[abbrs_linux]  # only on Linux
sai = "sudo apt install"
