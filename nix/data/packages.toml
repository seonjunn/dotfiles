# Packages installed by Home Manager, read by nix/home/*.nix (data only). Names are nixpkgs attributes.
# Rule: add a tool here only together with removing its other copies (cargo, ~/bin, /usr/local, apt).

[cli]
names = ["bat", "eza", "fd", "gh", "gum", "jq", "ripgrep", "yq-go", "nixfmt"]

[dev]  # build tools
names = ["cmake"]

[android]  # devices over adb (android.nix, opt-in); SDK/NDK for builds are not here
names = ["android-tools"]  # adb, fastboot

[editor]
names = ["vim", "neovim"]  # neovim: binary only for now; config and EDITOR switch come later

[runtime]
names = ["nodejs_24"]
